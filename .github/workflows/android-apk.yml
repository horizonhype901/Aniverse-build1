# Builds an installable Android APK with GitHub Actions (free tier) —
# no Expo EAS quota needed. Trigger manually from the Actions tab
# ("Run workflow") — pushes do not auto-build to save free minutes.
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Generate debug keystore (for sideload signing)
        run: >
          keytool -genkey -v -keystore /tmp/debug.keystore
          -alias androiddebugkey -storepass android -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (JS always bundled in release)
        run: >
          cd android && ./gradlew assembleRelease --no-daemon -q
          -Pandroid.injected.signing.store.file=/tmp/debug.keystore
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aniverse-v5-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
