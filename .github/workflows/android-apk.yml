# Builds an installable Android APK with GitHub Actions (free tier) —
# no Expo EAS quota needed. Trigger manually from the Actions tab, or on
# every push to main.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK (JS bundled for sideloading)
        run: cd android && ./gradlew assembleDebug --no-daemon -q -PbundleInDebug=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aniverse-v5-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
